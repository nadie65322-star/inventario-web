<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Inventario</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <style>
    body {
      transition: background-color .2s, color .2s;
    }

    body.dark {
      background-color: #212529;
      color: #f8f9fa;
    }

    body.dark .navbar {
      background-color: #1a1d20 !important;
    }

    body.dark .card,
    body.dark .table {
      background-color: #2c3034;
      color: #f8f9fa;
      border-color: #3a3f44;
    }

    body.dark .table th,
    body.dark .table td {
      color: #f8f9fa;
      border-color: #3a3f44;
    }

    body.dark .form-control,
    body.dark .form-select {
      background-color: #1f2327;
      color: #f8f9fa;
      border-color: #3a3f44;
    }

    body.dark .form-control::placeholder {
      color: #adb5bd;
    }

    body.dark .btn-outline-dark {
      color: #f8f9fa;
      border-color: #f8f9fa;
    }

    body.dark .btn-outline-dark:hover {
      background-color: #f8f9fa;
      color: #212529;
    }
  </style>
</head>

<body>

<nav class="navbar px-3">
  <span class="navbar-brand">Inventario</span>
  <button class="btn btn-outline-dark" onclick="toggleMode()">🌙</button>
</nav>

<div class="container mt-4">
  {% block content %}{% endblock %}
</div>
<div class="modal fade" id="editModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Editar producto</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <input type="hidden" id="editId">

        <div class="mb-2">
          <label>Nombre</label>
          <input class="form-control" id="editNombre">
        </div>

        <div class="mb-2">
          <label>Categoría</label>
          <input class="form-control" id="editCategoria">
        </div>

        <div class="mb-2">
          <label>Presentación</label>
          <input class="form-control" id="editPresentacion">
        </div>

        <div class="mb-2">
          <label>Lote</label>
          <input class="form-control" id="editLote">
        </div>

        <div class="mb-2">
          <label>Fecha de vencimiento</label>
          <input type="month" class="form-control" id="editFecha">
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn btn-primary" id="btnGuardarEdicion">
          Guardar cambios
        </button>
      </div>

    </div>
  </div>
</div>


<!-- Bootstrap JS (OBLIGATORIO para modales) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- Tu JS -->
<script src="{{ url_for('static', filename='js/main.js') }}"></script>

<!-- Modo oscuro -->
<script>
function toggleMode() {
  document.body.classList.toggle('dark');
  localStorage.setItem(
    'modo',
    document.body.classList.contains('dark') ? 'dark' : 'light'
  );
}

(function () {
  if (localStorage.getItem('modo') === 'dark') {
    document.body.classList.add('dark');
  }
})();
</script>

</body>
</html>
